spring:
  application:
    name: abc-telecom-postpaid-billing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    platform: h2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

jwt:
  secret: your_jwt_secret
  expiration: 86400000 # 1 day in milliseconds

logging:
  level:
    org.springframework: INFO
    com.abc.telecom.billing: DEBUG

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

billing:
  rates:
    POSTPAID_MOBILE: 0.10
    POSTPAID_BROADBAND: 0.05
    TV: 0.20

# Profiles
---
spring:
  profiles: dev
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

---
spring:
  profiles: prod
  datasource:
    url: jdbc:mysql://your_production_db_url:3306/abc_telecom
    username: your_db_username
    password: your_db_password
    driver-class-name: com.mysql.cj.jdbc.Driver